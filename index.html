<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic Layout Template</title>
  <!-- Link external stylesheet -->
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <header>
    <div class="container">
      <h1>My Website</h1>
      <nav>
        <a href="#">Home</a> | 
        <a href="#">About</a> | 
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <section id="hero">
        <h2>Welcome</h2>
        <p>This is a simple semantic layout using header, main, section, and footer.</p>
      </section>

      <section id="about">
        <h2>About Us</h2>
        <p>We build clean and accessible web templates.</p>
      </section>

      <section id="services">
        <h2>Services</h2>
        <ul>
          <li>Web Design</li>
          <li>Frontend Development</li>
          <li>UI/UX Consulting</li>
        </ul>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 My Website. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
